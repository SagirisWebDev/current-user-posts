name: Deploy to WordPress.org

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Skip the SVN commit (verify build only)"
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME || 'dry-run-placeholder' }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD || 'dry-run-placeholder' }}
          SLUG: current-user-posts
          VERSION: ${{ github.event_name == 'workflow_dispatch' && 'dry-run' || github.ref_name }}
        with:
          generate-zip: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
